site_name: MEDHIRA RN Styles Cache
site_url: https://medhira-rn-styles-cache.readthedocs.io
site_description: React Native styles caching with LRU cache
site_author: MEDHIRA
docs_dir: docs

repo_name: HELLOMEDHIRA/medhira-rn-styles-cache
repo_url: https://github.com/HELLOMEDHIRA/medhira-rn-styles-cache

theme:
  name: material
  logo: https://raw.githubusercontent.com/HELLOMEDHIRA/medhira/main/assets/medhira-logo.png
  favicon: https://raw.githubusercontent.com/HELLOMEDHIRA/medhira/main/assets/medhira-logo.png
  palette:
    - scheme: default
      primary: teal
      accent: teal
    - scheme: slate
      primary: teal
      accent: teal
  features:
    - navigation.tabs
    - content.code.copy

nav:
  - Getting Started: index.md
  - Architecture: architecture.md
  - API: api.md
  - Examples: examples.md
  - About: about.md

markdown_extensions:
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - codehilite:
      guess_lang: false
  - toc:
      permalink: true
  - tables
  - fenced_code
  - attr_list

plugins:
  - search:
      lang: en
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true
      cache_safe: true

copyright: |
  &copy; 2024-2026 MEDHIRA. All rights reserved.
